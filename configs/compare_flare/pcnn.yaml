model:
  target: compare.flare.pcnn.module.PCNN
  params:
    pretrained: true
    dropout: 0.2
    learning_rate: 1.0e-5
    weight_decay: 1.0e-4
    max_epochs: 15

data:
  target: data.build.DataModuleFromConfig
  params:
    batch_size: 16
    num_workers: 8
    wrap: false
    shuffle_val_dataloader: false
    train:
      target: downstream.flare.data.dataset.FlareDataset
      params:
        modal_list: [hmi]
        enhance_type: [log1p, zscore]
        load_imgs: false
        torch_augment_type: [1024, 0.0, 0]
        time_interval: [0, 5000]
        time_step: 1
        label_path: downstream/flare/data/flare_daily_labels.csv
        expected_event_time_column: start_time
        class_groups: [0AB, C, M, X]
    validation:
      target: downstream.flare.data.dataset.FlareDataset
      params:
        modal_list: [hmi]
        enhance_type: [log1p, zscore]
        load_imgs: false
        torch_augment_type: [1024, 0.0, 0]
        time_interval: [5000, 6000]
        time_step: 1
        label_path: downstream/flare/data/flare_daily_labels.csv
        expected_event_time_column: start_time
        class_groups: [0AB, C, M, X]

lightning:
  callbacks:
    image_logger:
      params:
        disabled: true
  modelcheckpoint:
    params:
      monitor: val_macro_f1
      mode: max
      filename: '{epoch:06}'
      save_top_k: 1
      every_n_epochs: 1
      save_weights_only: false
  trainer:
    devices: [1]
    max_epochs: 15
    precision: 32-true
    deterministic: true
    benchmark: false
    log_every_n_steps: 10
    num_sanity_val_steps: 2
    check_val_every_n_epoch: 1
