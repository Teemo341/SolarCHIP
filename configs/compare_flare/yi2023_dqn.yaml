model:
  target: compare.flare.yi2023_dqn.module.Yi2023DQN
  params:
    training_mode: dqn
    learning_rate: 1.0e-4
    weight_decay: 0.0
    gamma: 0.99
    epsilon_start: 1.0
    epsilon_end: 0.05
    epsilon_decay_steps: 20000
    replay_capacity: 128
    replay_batch_size: 8
    replay_warmup: 32
    gradient_updates_per_batch: 1
    checkpoint_replay: true
    rmsprop_alpha: 0.99
    rmsprop_epsilon: 1.0e-8
    rmsprop_momentum: 0.0
    target_sync_epochs: 2
    reward_tp: 8.0
    reward_fp: -64.0
    reward_fn: -8.0
    reward_tn: 1.0
    max_epochs: 100
    seed: 42

data:
  target: data.build.DataModuleFromConfig
  params:
    batch_size: 8
    num_workers: 8
    wrap: false
    shuffle_val_dataloader: false
    train:
      target: downstream.flare.data.dataset.FlareDataset
      params:
        modal_list: [hmi]
        enhance_type: [log1p, zscore]
        load_imgs: false
        torch_augment_type: [1024, 0.0, 0]
        time_interval: [0, 5000]
        time_step: 1
        label_path: downstream/flare/data/flare_daily_labels.csv
        expected_event_time_column: start_time
        class_groups: [0AB, C, M, X]
    validation:
      target: downstream.flare.data.dataset.FlareDataset
      params:
        modal_list: [hmi]
        enhance_type: [log1p, zscore]
        load_imgs: false
        torch_augment_type: [1024, 0.0, 0]
        time_interval: [5000, 6000]
        time_step: 1
        label_path: downstream/flare/data/flare_daily_labels.csv
        expected_event_time_column: start_time
        class_groups: [0AB, C, M, X]

lightning:
  callbacks:
    image_logger:
      params:
        disabled: true
  modelcheckpoint:
    params:
      monitor: val_macro_f1
      mode: max
      filename: '{epoch:06}'
      save_top_k: 1
      every_n_epochs: 1
      save_weights_only: false
  trainer:
    devices: [2]
    max_epochs: 100
    precision: 32-true
    deterministic: true
    benchmark: false
    log_every_n_steps: 10
    num_sanity_val_steps: 2
    check_val_every_n_epoch: 1
