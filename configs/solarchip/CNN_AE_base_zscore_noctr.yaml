model:
  target: solarchip.SolarCHIP.solarchip_base
  params:
    save_memory: True
    ckpt_path: null
    base_model:
      target: solarchip.modules.CNN.AE_CNN
      params:
        contrastive_dim: 32
        ckpt_path: null

        ddconfig:
          double_z: False
          z_channels: 32
          resolution: 1024
          in_channels: 1
          out_ch: 1
          ch: 32
          ch_mult: [1,1,1,2,2,2]
          num_res_blocks: 2
          attn_resolutions: [32, 64]
          use_linear_attn: False
          dropout: 0.0

    loss_config:
      epochs: 200
      lr: 1e-4
      optimizer: "AdamW"
      scheduler: "CosineAnnealingLR"
      rec_loss_type: l2
      kl_weight: 0.0
      perceptual_weight: 0.0
      cls_contrastive_weight: 0.0
      pat_contrastive_weight: 0.0
      int_contrastive_weight: 0.0

data:
  target: data.build.DataModuleFromConfig
  params:
    batch_size: 5
    num_workers: 8
    wrap: False
    train:
      target: data.dataset.SolarDataset.multimodal_dataset
      params:
        enhance_type: ['log1p','zscore']
        load_imgs: False
        torch_augment_type:
          - 1024
          - 0.5
          - 360
        time_interval: 
          - 0
          - 5000
        time_step: 10
    validation:
      target: data.dataset.SolarDataset.multimodal_dataset
      params:
        enhance_type: ['log1p', 'zscore']
        load_imgs: False
        torch_augment_type:
          - 1024
          - 0.5
          - 360
        time_interval: 
          - 5000
          - 5400
        time_step: 10


lightning:
  callbacks:
    image_logger:
      target: solarchip.utils.callback.SolarImageLogger
      params:
        log_on_batch_idx: False
        # 第 N、2N、3N... 个 train epoch 各绘制一次 train/validation 图像。
        every_n_train_epochs: 5
        max_images: 2
        
    early_stop:
      target: pytorch_lightning.callbacks.EarlyStopping
      params:
            monitor: val_rec_loss
            patience: 30

  modelcheckpoint:
    params:
      monitor: val_rec_loss
      filename: '{epoch:06}_{val_rec_loss:.4f}'
      save_top_k: 3
      every_n_epochs: 1
      save_weights_only: False

  trainer:
    max_epochs: 200
    precision: bf16-mixed
    log_every_n_steps: 6
    strategy: ddp_find_unused_parameters_true
    # devices: [0]
