model:
  target: solarchip.SolarCHIP.solarchip_base
  params:
    save_memory: True
    ckpt_path: null
    base_model:
      target: solarchip.modules.CNN.AE_CNN
      params:
        contrastive_dim: 32
        ckpt_path: null

        ddconfig:
          double_z: False
          z_channels: 32
          resolution: 1024
          in_channels: 1
          out_ch: 1
          ch: 32
          ch_mult: [1,1,1,2,2,2]
          num_res_blocks: 2
          attn_resolutions: []
          use_linear_attn: False
          dropout: 0.0

    loss_config:
      epochs: 200
      lr: 1e-3
      optimizer: "AdamW"
      rec_loss_type: l2
      kl_weight: 0.0
      perceptual_weight: 0.0
      cls_contrastive_weight: 0.01
      pat_contrastive_weight: 0.0001
      int_contrastive_weight: 0.0001

data:
  target: data.build.DataModuleFromConfig
  params:
    batch_size: 5
    num_workers: 8
    wrap: False
    train:
      target: data.dataset.SolarDataset.multimodal_dataset
      params:
        enhance_type: ['log1p','zscore']
        modal_stats_path: 'data/idx_list/modal_stats.json'  # pre-computed stats
        rescale_value: 1
        load_imgs: False
        torch_augment_type:
          - 1024
          - 0.5
          - 360
        time_interval: 
          - 0
          - 5000
        time_step: 10
    validation:
      target: data.dataset.SolarDataset.multimodal_dataset
      params:
        enhance_type: 'zscore'
        modal_stats_path: 'data/idx_list/modal_stats.json'
        rescale_value: 1
        load_imgs: False
        torch_augment_type:
          - 1024
          - 0.5
          - 360
        time_interval: 
          - 5000
          - 5400
        time_step: 10


lightning:
  callbacks:
    image_logger:
      target: solarchip.utils.callback.SolarImageLogger
      params:
        batch_frequency: 23
        max_images: 2
        
    early_stop:
      target: pytorch_lightning.callbacks.EarlyStopping
      params:
            monitor: val_loss
            patience: 30

  modelcheckpoint:
    params:
      monitor: val_loss
      save_last: True
      save_top_k: 3
      every_n_epochs: 1
      save_weights_only: True

  trainer:
    max_epochs: 200
    precision: bf16
    log_every_n_steps: 6
