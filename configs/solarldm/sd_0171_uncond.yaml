# ============================================================
# SolarLDM Unconditional: 先训一个高质量无条件 0171 生成模型,
# 作为后续 ControlNet 训练的冻结 backbone。
#
# 关键设计:
#   conditioning_key: None → 纯无条件扩散, UNet 结构和 ControlNet 主干一致
#   UNet 无 spatial_transformer → 和 ctrl_xxx.yaml 的 UNet 完全匹配
#
# 训练完后，把 checkpoint 路径通过对应的 ctrl config 的
# model.params.sd_backbone_ckpt 传入；SolarControl 会严格初始化主 UNet 和 ControlNet encoder。
# ============================================================

model:
  target: downstream.ldm.SolarLDM.SolarLDM
  params:
    first_stage_key: '0171'
    cond_stage_key:  '0171'      # 接口占位；真正无条件模式不会构造或编码 cond stage

    learning_rate: 5e-5
    image_size: 32
    channels: 32
    timesteps: 1000
    beta_schedule: linear
    linear_start: 0.00085
    linear_end: 0.0120
    log_every_t: 100
    loss_type: l2
    parameterization: eps
    monitor: val/loss_simple_ema
    use_ema: True
    scale_by_std: False               # 旧的单标量 normalization，保持关闭

    # ---- LR scheduler ----
    scheduler_config:
      target: auxiliary.ldm.lr_scheduler.LambdaWarmUpCosineScheduler
      params:
        warm_up_steps: 3080
        lr_start: 0.01
        lr_min: 0.1
        lr_max: 1.0
        max_decay_steps: 61600

    concat_mode: False
    cond_stage_config: "__is_unconditional__"       # 无条件训练 → UNet 纯去噪器, 无 spatial_transformer

    # ---- AE wrapper (同一份预训练 AE) ----
    solarchip_config:
      target: solarchip.SolarCHIP.solarchip_base
      params:
        # 无条件模型只需要一个模态的 AE；checkpoint 中其它模态权重会作为 unexpected keys 忽略。
        modal_list: ['hmi', '0171']
        save_memory: True
        ckpt_path: checkpoints/solarchip/CNN_AE_base_zscore/checkpoints/epoch=000187_val_loss=1.0262.ckpt
        base_model:
          target: solarchip.modules.CNN.AE_CNN
          params:
            contrastive_dim: 32
            ckpt_path: null
            ddconfig:
              double_z: False
              z_channels: 32
              resolution: 1024
              in_channels: 1
              out_ch: 1
              ch: 32
              ch_mult: [1, 1, 1, 2, 2, 2]
              num_res_blocks: 2
              attn_resolutions: []
              use_linear_attn: False
              dropout: 0.0
        loss_config: null

    # ---- UNet (必须和对应 ctrl config 的 unet_config 完全一致) ----
    unet_config:
      target: auxiliary.ldm.modules.diffusionmodules.openaimodel.UNetModel
      params:
        image_size: 32
        in_channels: 32
        out_channels: 32
        model_channels: 320
        attention_resolutions: [4, 2, 1]
        num_res_blocks: 2
        channel_mult: [1, 2, 4, 4]
        num_heads: 8
        use_checkpoint: True
        legacy: False

data:
  target: data.build.DataModuleFromConfig
  params:
    batch_size: 16
    num_workers: 4
    wrap: False
    train:
      target: data.dataset.SolarDataset.multimodal_dataset
      params:
        modal_list: ['hmi', '0171']
        enhance_type: ['log1p', 'zscore']
        load_imgs: False
        torch_augment_type:
          - 1024
          - 0.5
          - 360
        time_interval:
          - 0
          - 5000
        time_step: 1
    validation:
      target: data.dataset.SolarDataset.multimodal_dataset
      params:
        modal_list: ['hmi', '0171']
        enhance_type: ['log1p', 'zscore']
        load_imgs: False
        torch_augment_type:
          - 1024
          - 0.5
          - 360
        time_interval:
          - 5000
          - 6000
        time_step: 1

lightning:
  callbacks:
    image_logger:
      target: solarchip.utils.callback.SolarImageLogger
      params:
        log_on_batch_idx: False
        # 第 N、2N、3N... 个 train epoch 各绘制一次 train/validation 图像。
        every_n_train_epochs: 40
        max_images: 2
        log_images_kwargs:
          # ddim_steps: 100
          # ddim_eta: 0.0
          ddim_steps: null

  modelcheckpoint:
    params:
      monitor: val/loss_simple_ema
      filename: '{epoch:06}'
      mode: min
      save_top_k: 3
      every_n_epochs: 1
      save_weights_only: False

  trainer:
    strategy: ddp
    num_sanity_val_steps: 0      # latent stats 在 on_train_start 完整预计算后再做验证
    max_epochs: 1600
    precision: bf16-mixed
    log_every_n_steps: 1
