# ============================================================
# SolarLDM: 在 SolarCHIP 多模态 AE 的 latent 空间上训练 LDM。
# 默认 first_stage_key='hmi', cond_stage_key='0193';
# 改其它模态名只需替换下方两个字段。
# ------------------------------------------------------------
# 运行示例(在仓库根目录):
#   python -m solarchip.main.train -b ./configs/solarldm/solarldm.yaml
# ============================================================

model:
  target: downstream.ldm.SolarLDM.SolarLDM
  params:
    # ---- SolarCHIP custom keys ----
    first_stage_key: 'hmi'      # 要重建/生成的模态
    cond_stage_key:  '0094'     # 条件模态(与 first 相同则视为无条件 / self-condition)

    # ---- LDM 基础超参 ----
    learning_rate: 1e-4
    image_size: 32              # latent 边长 = 1024 / 2^(len(ch_mult)-1) = 1024 / 32 = 32
    channels: 32                # latent 通道数 = AE_CNN.ddconfig.z_channels
    timesteps: 1000
    beta_schedule: linear
    linear_start: 0.00085
    linear_end: 0.0120
    log_every_t: 100
    loss_type: l2
    parameterization: eps
    monitor: val/loss_simple_ema
    use_ema: True
    scale_by_std: True           # 自动计算 scale_factor = 1/std(latent), 使 latent 归一化

    # 条件注入方式:
    #   - 'concat'    把 cond latent 沿 channel 维拼到输入 — 适合
    #                 first/cond AE 输出形状完全相同的情况(同一套 ddconfig 默认就是)。
    #   - 'crossattn' 用交叉注意力,需要在 unet_config 里打开 spatial_transformer。
    conditioning_key: crossattn

    # ---- 11-模态 SolarCHIP wrapper:训练 SolarLDM 前必须有可加载的 ckpt ----
    # 这里复用 configs/solarchip/CNN_AE_base.yaml 的同一份 wrapper 描述,
    # 只是额外提供 ckpt_path,让所有 AE 都从训练好的权重里恢复。
    # SolarLDM 会在初始化后把没用到的 AE_CNN 全部丢掉,节省显存。
    solarchip_config:
      target: solarchip.SolarCHIP.solarchip_base
      params:
        modal_list: ['hmi','0094','0131','0171','0193','0211','0304','0335','1600','1700','4500']
        save_memory: True
        # !!! 加载 zscore 预训练的 SolarCHIP checkpoint !!!
        ckpt_path: logs/solarchip_CNN_AE_base_zscore_2026-07-10T18-03-45/checkpoints/last.ckpt
        base_model:
          target: solarchip.modules.CNN.AE_CNN
          params:
            contrastive_dim: 32
            ckpt_path: null
            ddconfig:
              double_z: False
              z_channels: 32
              resolution: 1024
              in_channels: 1
              out_ch: 1
              ch: 32
              ch_mult: [1, 1, 1, 2, 2, 2]   # 6 个阶段 -> spatial /32
              num_res_blocks: 2
              attn_resolutions: []
              use_linear_attn: False
              dropout: 0.0
        # loss_config 留空即可:SolarLDM 不再继续训练 AE。
        loss_config: null

    # ---- UNet(latent space 去噪网络) ----
    unet_config:
      target: auxiliary.ldm.modules.diffusionmodules.openaimodel.UNetModel
      params:
        image_size: 32          # 与上面 image_size 一致
        # crossattn 模式下输入只有 noisy latent，不再 concat cond
        in_channels: 32         # = z_channels
        out_channels: 32        # = z_channels
        model_channels: 320
        attention_resolutions: [ 4, 2, 1 ]
        num_res_blocks: 2
        channel_mult: [ 1, 2, 4, 4 ]
        num_heads: 8
        use_spatial_transformer: True
        transformer_depth: 1
        context_dim: 32
        use_checkpoint: True
        legacy: False

data:
  target: data.build.DataModuleFromConfig
  params:
    batch_size: 16
    num_workers: 4
    wrap: False
    train:
      target: data.dataset.SolarDataset.multimodal_dataset
      params:
        modal_list: ['hmi','0094','0131','0171','0193','0211','0304','0335','1600','1700','4500']
        enhance_type: ['log1p', 'zscore']
        load_imgs: False
        torch_augment_type:
          - 1024
          - 0.5
          - 360
        time_interval:
          - 0
          - 5000
        time_step: 10
    validation:
      target: data.dataset.SolarDataset.multimodal_dataset
      params:
        modal_list: ['hmi','0094','0131','0171','0193','0211','0304','0335','1600','1700','4500']
        enhance_type: ['log1p', 'zscore']
        load_imgs: False
        torch_augment_type:
          - 1024
          - 0.5
          - 360
        time_interval:
          - 5000
          - 5400
        time_step: 10

lightning:
  callbacks:
    image_logger:
      target: solarchip.utils.callback.SolarImageLogger
      params:
        log_on_batch_idx: False
        batch_frequency: 32
        max_images: 2

  modelcheckpoint:
    params:
      monitor: val/loss_simple_ema
      filename: '{epoch:06}'
      mode: min
      save_last: True
      save_top_k: 3
      every_n_epochs: 1
      save_weights_only: True

  trainer:
    strategy: ddp
    max_epochs: 200
    precision: bf16-mixed
    log_every_n_steps: 4
    # devices: [0]
