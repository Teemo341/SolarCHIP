# ============================================================
# SolarControl: 用 cond_stage_key 模态的 SolarCHIP latent 作为
# ControlNet hint,控制 first_stage_key 模态的扩散生成。
# 默认 first_stage_key='hmi', cond_stage_key='0193',backbone 从零联训。
# ------------------------------------------------------------
# 运行示例(在仓库根目录):
#   python -m solarchip.main.train -b ./configs/solarldm/solarcontrol_base.yaml
# ============================================================

model:
  target: downstream.ldm.SolarControl.SolarControl
  params:
    # ---- SolarCHIP custom keys ----
    first_stage_key: 'hmi'      # 要生成的模态
    cond_stage_key:  '0193'     # 提供控制信号的模态

    # ---- LDM 基础超参 ----
    learning_rate: 1.0e-4
    image_size: 16              # latent 边长 = 1024 / 2^(len(ch_mult)-1)
    channels: 128               # latent 通道 = AE_CNN.ddconfig.z_channels
    timesteps: 1000
    beta_schedule: linear
    linear_start: 0.00085
    linear_end: 0.0120
    log_every_t: 100
    loss_type: l2
    parameterization: eps
    monitor: val/loss_simple_ema
    use_ema: True

    # cond 不走 DiffusionWrapper(concat/crossattn),而是经 ControlNet 分支注入。
    # SolarControl.__init__ 会把这个字段强制覆盖为 None,这里写出来只是提示。
    # conditioning_key: null

    # ---- ControlNet 相关 ----
    only_mid_control: False     # True 时只用 middle_block 控制,做消融用
    sd_locked: False            # 用户选项:解锁主 UNet,联合训练
    cond_drop_prob: 0.1         # 训练时 10% 概率把 hint 置零,启用 CFG
    # control_scales: 不写就是全 1;13 个值(12 input zero_convs + 1 middle)

    # ---- 11-模态 SolarCHIP wrapper(冻结的 first/cond stage AE) ----
    solarchip_config:
      target: solarchip.SolarCHIP.solarchip_base
      params:
        modal_list: ['hmi','0094','0131','0171','0193','0211','0304','0335','1600','1700','4500']
        save_memory: True
        # !!! 换成你训好的 SolarCHIP checkpoint !!!
        ckpt_path: logs/CNN_AE_base_solarchip_/checkpoints/last.ckpt
        base_model:
          target: solarchip.modules.CNN.AE_CNN
          params:
            contrastive_dim: 128
            ckpt_path: null
            ddconfig:
              double_z: False
              z_channels: 128
              resolution: 1024
              in_channels: 1
              out_ch: 1
              ch: 64
              ch_mult: [1, 1, 1, 1, 2, 2, 2]
              num_res_blocks: 2
              attn_resolutions: []
              use_linear_attn: False
              dropout: 0.0
        loss_config: null

    # ---- 主 UNet(被控分支,SolarControlledUnetModel 解开 no_grad) ----
    unet_config:
      target: downstream.ldm.SolarControl.SolarControlledUnetModel
      params:
        image_size: 16
        in_channels: 128            # = z_channels(纯 z_t 进入,cond 不在这里 concat)
        out_channels: 128
        model_channels: 192
        num_res_blocks: 2
        attention_resolutions: [4, 2, 1]    # 在 16/4, 16/2, 16/1 三个层级加 attention
        channel_mult: [1, 2, 4]
        num_head_channels: 32
        use_scale_shift_norm: True
        resblock_updown: True

    # ---- ControlNet 分支(SolarControlNet:input_hint_block 已替换为 latent 投影) ----
    control_stage_config:
      target: downstream.ldm.SolarControl.SolarControlNet
      params:
        image_size: 16
        in_channels: 128            # 跟主 UNet 输入一致(ControlNet 内部也接受 z_t)
        hint_channels: 128          # = SolarCHIP cond latent 通道数(z_channels)
        model_channels: 192
        num_res_blocks: 2
        attention_resolutions: [4, 2, 1]
        channel_mult: [1, 2, 4]
        num_head_channels: 32
        use_scale_shift_norm: True
        resblock_updown: True

data:
  target: data.build.DataModuleFromConfig
  params:
    batch_size: 2
    num_workers: 8
    wrap: False
    train:
      target: data.dataset.SolarDataset.multimodal_dataset
      params:
        modal_list: ['hmi','0094','0131','0171','0193','0211','0304','0335','1600','1700','4500']
        log1p_scale: 1
        load_imgs: False
        enhance_list:
          - 1024
          - 0.5
          - 360
        time_interval:
          - 0
          - 5000
        time_step: 10
    validation:
      target: data.dataset.SolarDataset.multimodal_dataset
      params:
        modal_list: ['hmi','0094','0131','0171','0193','0211','0304','0335','1600','1700','4500']
        log1p_scale: 1
        load_imgs: False
        enhance_list:
          - 1024
          - 0.5
          - 360
        time_interval:
          - 5000
          - 5400
        time_step: 10

lightning:
  callbacks:
    image_logger:
      target: solarchip.utils.callback.SolarImageLogger
      params:
        batch_frequency: 500
        max_images: 2
        clamp: False

  modelcheckpoint:
    params:
      monitor: val/loss_simple_ema
      mode: min
      save_last: True
      save_top_k: 3
      every_n_epochs: 1
      save_weights_only: True

  trainer:
    max_epochs: 200
    precision: bf16
    log_every_n_steps: 10
    # devices: [0]
