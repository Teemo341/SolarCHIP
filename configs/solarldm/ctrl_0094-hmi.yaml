# ============================================================
# SolarControl: ControlNet-style 条件扩散, 0094 → hmi
# 基于 sd_0094-hmi.yaml 的超参, 将 concat 条件改为 ControlNet 分支注入。
#
# 与 concat 版本的关键差异:
#   1. cond 不再沿 channel 拼到 z_t, 而是通过 ControlNet 分支逐层注入 skip 连接
#   2. 主 UNet in_channels 从 64 降回 32 (不再翻倍)
#   3. 额外增加 ControlNet 分支 (~1× UNet encoder 参数量)
#   4. 开启 EMA + hint dropout, 推理时可做 CFG
#
# 运行示例:
#   python -m solarchip.main.train -b ./configs/solarldm/sd_0094-hmi_controlnet.yaml
# ============================================================

model:
  target: downstream.ldm.SolarControl.SolarControl
  params:
    # ---- SolarCHIP custom keys (与 concat 版一致) ----
    first_stage_key: 'hmi'      # 要生成的模态
    cond_stage_key:  '0094'     # 提供控制信号的模态

    # ---- LDM 基础超参 (与 sd_0094-hmi.yaml 保持一致) ----
    learning_rate: 1e-4
    image_size: 32              # latent 边长 = 1024 / 32
    channels: 32                # latent 通道数 = AE_CNN.ddconfig.z_channels
    timesteps: 1000
    beta_schedule: linear
    linear_start: 0.00085
    linear_end: 0.0120
    log_every_t: 100
    loss_type: l2
    parameterization: eps
    monitor: val/loss_simple_ema
    use_ema: True               # ControlNet 模式下 EMA 有助于稳定采样质量
    scale_by_std: True           # 自动计算 scale_factor = 1/std(latent), 使 latent 归一化

    # ---- ControlNet 相关 ----
    only_mid_control: False     # False: 全部 13 层 zero-conv 注入; True: 仅 middle block (消融用)
    sd_locked: False            # False: 主 UNet 与 ControlNet 联合从零训练
    cond_drop_prob: 0.1         # 训练时 10% 概率把 hint 置零, 推理时可做 CFG

    # ---- 11-模态 SolarCHIP wrapper (与 concat 版同一份 AE ckpt) ----
    solarchip_config:
      target: solarchip.SolarCHIP.solarchip_base
      params:
        modal_list: ['hmi','0094','0131','0171','0193','0211','0304','0335','1600','1700','4500']
        save_memory: True
        # !!! 与 sd_0094-hmi.yaml 相同的 zscore 预训练 checkpoint !!!
        ckpt_path: logs/solarchip_CNN_AE_base_zscore_2026-07-10T18-03-45/checkpoints/last.ckpt
        base_model:
          target: solarchip.modules.CNN.AE_CNN
          params:
            contrastive_dim: 32
            ckpt_path: null
            ddconfig:
              double_z: False
              z_channels: 32
              resolution: 1024
              in_channels: 1
              out_ch: 1
              ch: 32
              ch_mult: [1, 1, 1, 2, 2, 2]   # 6 阶段 → spatial /32
              num_res_blocks: 2
              attn_resolutions: []
              use_linear_attn: False
              dropout: 0.0
        loss_config: null

    # ---- 主 UNet (被控分支) ----
    # 与 concat 版唯一区别: in_channels 从 64 → 32 (cond 不再走 concat)
    unet_config:
      target: downstream.ldm.SolarControl.SolarControlledUnetModel
      params:
        image_size: 32
        in_channels: 32            # 纯 z_t, cond 走 ControlNet 分支
        out_channels: 32
        model_channels: 320
        attention_resolutions: [4, 2, 1]
        num_res_blocks: 2
        channel_mult: [1, 2, 4, 4]
        num_heads: 8
        use_checkpoint: True
        legacy: False

    # ---- ControlNet 分支 (与主 UNet encoder 结构镜像) ----
    # hint_channels = cond latent 通道数 = z_channels = 32
    # 其余参数与主 UNet 一致, 保证 skip 连接 shape 对齐
    control_stage_config:
      target: downstream.ldm.SolarControl.SolarControlNet
      params:
        image_size: 32
        in_channels: 32
        hint_channels: 32           # = SolarCHIP cond latent 通道数
        model_channels: 320
        attention_resolutions: [4, 2, 1]
        num_res_blocks: 2
        channel_mult: [1, 2, 4, 4]
        num_heads: 8
        use_checkpoint: True
        legacy: False

# ---- 数据 (与 concat 版完全一致, 使用 zscore 预处理) ----
data:
  target: data.build.DataModuleFromConfig
  params:
    batch_size: 16              # ControlNet 分支增加 ~1.5x 参数, 适当降低 batch
    num_workers: 4
    wrap: False
    train:
      target: data.dataset.SolarDataset.multimodal_dataset
      params:
        modal_list: ['hmi','0094','0131','0171','0193','0211','0304','0335','1600','1700','4500']
        enhance_type: ['log1p', 'zscore']
        load_imgs: False
        torch_augment_type:
          - 1024
          - 0.5
          - 360
        time_interval:
          - 0
          - 5000
        time_step: 10
    validation:
      target: data.dataset.SolarDataset.multimodal_dataset
      params:
        modal_list: ['hmi','0094','0131','0171','0193','0211','0304','0335','1600','1700','4500']
        enhance_type: ['log1p', 'zscore']
        load_imgs: False
        torch_augment_type:
          - 1024
          - 0.5
          - 360
        time_interval:
          - 5000
          - 5400
        time_step: 10

lightning:
  callbacks:
    image_logger:
      target: solarchip.utils.callback.SolarImageLogger
      params:
        log_on_batch_idx: False
        batch_frequency: 32
        max_images: 2

  modelcheckpoint:
    params:
      monitor: val/loss_simple_ema
      filename: '{epoch:06}'
      mode: min 
      save_last: True
      save_top_k: 3
      every_n_epochs: 1
      # save_weights_only: False

  trainer:
    strategy: ddp
    max_epochs: 200
    precision: bf16-mixed
    log_every_n_steps: 4
    # devices: [0]
