# Galvez et al. SDOML-CNN comparison: HMI -> AIA 0304
# Evidence status: paper output channel; project adapts 3-to-9 vector task to 1-to-1 LOS task
# Run from repository root:
# python -m solarchip.main.train -b configs/compare_transfer/hmi_aia_sdoml_cnn_0304.yaml

model:
  target: compare.transfer.hmi_to_aia.sdoml_cnn.module.GalvezSDOMLCNN
  params:
    source_modal: 'hmi'
    target_modal: '0304'
    input_channels: 1
    output_channels: 1
    hidden_channels: 128
    # The paper compares 3/7/11 layers; 11 is the strongest aggregate baseline.
    num_layers: 11
    learning_rate: 1.0e-3
    momentum: 0.99
    weight_decay: 1.0e-8
    lr_step_size: 5
    lr_gamma: 0.1
    target_mean: 1.7023200257985773
    target_std: 1.4301543643478678
    metric_max_log_value: 20.0

data:
  target: data.build.DataModuleFromConfig
  params:
    batch_size: 16              # ControlNet 分支增加 ~1.5x 参数, 适当降低 batch
    num_workers: 4
    wrap: False
    train:
      target: data.dataset.SolarDataset.multimodal_dataset
      params:
        modal_list: ['hmi','0304']
        enhance_type: ['log1p', 'zscore']
        load_imgs: False
        torch_augment_type:
          - 1024
          - 0.5
          - 360
        time_interval:
          - 0
          - 5000
        time_step: 1
    validation:
      target: data.dataset.SolarDataset.multimodal_dataset
      params:
        modal_list: ['hmi','0304']
        enhance_type: ['log1p', 'zscore']
        load_imgs: False
        torch_augment_type:
          - 1024
          - 0.5
          - 360
        time_interval:
          - 5000
          - 6000
        time_step: 1

lightning:
  callbacks:
    image_logger:
      target: solarchip.utils.callback.SolarImageLogger
      params:
        log_on_batch_idx: False
        # 第 N、2N、3N... 个 train epoch 各绘制一次 train/validation 图像。
        every_n_train_epochs: 20
        max_images: 2

  modelcheckpoint:
    params:
      monitor: val/loss
      filename: '{epoch:06}'
      mode: min
      save_last: true
      save_top_k: 1
      every_n_epochs: 1
      # Full checkpoints retain both Adam states for resume.
      save_weights_only: False

  trainer:
    strategy: ddp
    num_sanity_val_steps: 0
    max_epochs: 200
    precision: bf16-mixed
    log_every_n_steps: 1
