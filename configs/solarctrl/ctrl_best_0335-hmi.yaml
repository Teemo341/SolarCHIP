# ============================================================
# SolarControl: ControlNet-style 条件扩散, 0335 → hmi
# 基于 sd_0335-hmi.yaml 的超参, 将 concat 条件改为 ControlNet 分支注入。
#
# 与 concat 版本的关键差异:
#   1. cond 不再沿 channel 拼到 z_t, 而是通过 ControlNet 分支逐层注入 skip 连接
#   2. 主 UNet in_channels 从 64 降回 32 (不再翻倍)
#   3. 额外增加 ControlNet 分支 (~1× UNet encoder 参数量)
#   4. 开启 hint dropout, 推理时可做 CFG
#
# 运行示例:
#   python -m solarchip.main.train -b ./configs/solarldm/ctrl_0335-hmi.yaml \
#       model.params.sd_backbone_ckpt=logs/<hmi-uncond-run>/checkpoints/last.ckpt
# ============================================================

model:
  target: downstream.ldm.SolarControl.SolarControl
  params:
    # ---- SolarCHIP custom keys (与 concat 版一致) ----
    first_stage_key: 'hmi'      # 要生成的模态
    cond_stage_key:  '0335'     # 提供控制信号的模态

    # ---- LDM 基础超参 (与 sd_0335-hmi.yaml 保持一致) ----
    learning_rate: 5e-5
    image_size: 32              # latent 边长 = 1024 / 32
    channels: 32                # latent 通道数 = AE_CNN.ddconfig.z_channels
    timesteps: 1000
    beta_schedule: linear
    linear_start: 0.00085
    linear_end: 0.0120
    log_every_t: 100
    loss_type: l2
    parameterization: eps
    monitor: val/loss_simple
    use_ema: False              # 主 UNet 已冻结；DDPM 的 EMA 只跟踪主 UNet，必须关闭
    scale_by_std: False               # 旧的单标量 normalization，保持关闭

    # ---- LR scheduler: warmup + cosine decay ----
    scheduler_config:
      target: auxiliary.ldm.lr_scheduler.LambdaWarmUpCosineScheduler
      params:
        warm_up_steps: 3080        # 前 1000 步线性 warmup
        lr_start: 0.01             # warmup 起始 multiplier (base_lr × 0.01 = 1e-6)
        lr_min: 0.1                # 最终 multiplier (base_lr × 0.1 = 1e-5)
        lr_max: 1.0                # warmup 峰值 multiplier (base_lr × 1.0 = 1e-4)
        max_decay_steps: 61600     # 余弦衰减的总步数，按你的总训练步数调整

    # ---- ControlNet 相关 ----
    only_mid_control: False     # False: 全部 13 层 zero-conv 注入; True: 仅 middle block (消融用)
    # 训练时必须通过 CLI 覆盖为新训练的 HMI unconditional checkpoint 路径：
    # model.params.sd_backbone_ckpt=logs/<hmi-uncond-run>/checkpoints/last.ckpt
    sd_backbone_ckpt: checkpoints/solarldm/sd_hmi_uncond/checkpoints/epoch=000888.ckpt
    sd_backbone_use_ema: True   # 使用源 SD checkpoint 的 EMA 权重初始化
    sd_locked: True             # True: 完整冻结预训练主 UNet，只训练 ControlNet
    cond_drop_prob: 0.1         # 训练时 10% 概率把 hint 置零, 推理时可做 CFG

    # ---- 11-模态 SolarCHIP wrapper (与 concat 版同一份 AE ckpt) ----
    solarchip_config:
      target: solarchip.SolarCHIP.solarchip_base
      params:
        modal_list: ['hmi','0094','0131','0171','0193','0211','0304','0335','1600','1700','4500']
        save_memory: True
        # !!! 与 sd_0335-hmi.yaml 相同的 zscore 预训练 checkpoint !!!
        ckpt_path: checkpoints/solarchip/CNN_AE_base_zscore/checkpoints/epoch=000187_val_loss=1.0262.ckpt
        base_model:
          target: solarchip.modules.CNN.AE_CNN
          params:
            contrastive_dim: 32
            ckpt_path: null
            ddconfig:
              double_z: False
              z_channels: 32
              resolution: 1024
              in_channels: 1
              out_ch: 1
              ch: 32
              ch_mult: [1, 1, 1, 2, 2, 2]   # 6 阶段 → spatial /32
              num_res_blocks: 2
              attn_resolutions: []
              use_linear_attn: False
              dropout: 0.0
        loss_config: null

    # ---- 主 UNet (被控分支) ----
    # 与 concat 版唯一区别: in_channels 从 64 → 32 (cond 不再走 concat)
    unet_config:
      target: downstream.ldm.SolarControl.SolarControlledUnetModel
      params:
        image_size: 32
        in_channels: 32            # 纯 z_t, cond 走 ControlNet 分支
        out_channels: 32
        model_channels: 320
        attention_resolutions: [4, 2, 1]
        num_res_blocks: 2
        channel_mult: [1, 2, 4, 4]
        num_heads: 8
        use_checkpoint: True
        legacy: False

    # ---- ControlNet 分支 (与主 UNet encoder 结构镜像) ----
    # hint_channels = cond latent 通道数 = z_channels = 32
    # 其余参数与主 UNet 一致, 保证 skip 连接 shape 对齐
    control_stage_config:
      target: downstream.ldm.SolarControl.SolarControlNet
      params:
        image_size: 32
        in_channels: 32
        hint_channels: 32           # = SolarCHIP cond latent 通道数
        model_channels: 320
        attention_resolutions: [4, 2, 1]
        num_res_blocks: 2
        channel_mult: [1, 2, 4, 4]
        num_heads: 8
        use_checkpoint: True
        legacy: False

# ---- 数据 (与 concat 版完全一致, 使用 zscore 预处理) ----
data:
  target: data.build.DataModuleFromConfig
  params:
    batch_size: 16              # ControlNet 分支增加 ~1.5x 参数, 适当降低 batch
    num_workers: 4
    wrap: False
    train:
      target: data.dataset.SolarDataset.multimodal_dataset
      params:
        modal_list: ['hmi','0335']
        enhance_type: ['log1p', 'zscore']
        load_imgs: False
        torch_augment_type:
          - 1024
          - 0.5
          - 360
        time_interval:
          - 0
          - 5000
        time_step: 1
    validation:
      target: data.dataset.SolarDataset.multimodal_dataset
      params:
        modal_list: ['hmi','0335']
        enhance_type: ['log1p', 'zscore']
        load_imgs: False
        torch_augment_type:
          - 1024
          - 0.5
          - 360
        time_interval:
          - 5000
          - 6000
        time_step: 1

lightning:
  callbacks:
    image_logger:
      target: solarchip.utils.callback.SolarImageLogger
      params:
        log_on_batch_idx: False
        # 第 N、2N、3N... 个 train epoch 各绘制一次 train/validation 图像。
        every_n_train_epochs: 40
        max_images: 2
        log_images_kwargs:
          ddim_steps: 100
          # ddim_eta: 0.0
          # ddim_steps: null
          unconditional_guidance_scale: 3.0
    
    early_stop:
      params:
        monitor: val/loss_simple
        patience: 800
        mode: min

  modelcheckpoint:
    params:
      monitor: val/loss_simple
      filename: '{epoch:06d}_{val_loss_simple:.4f}'
      mode: min 
      save_last: True
      save_top_k: 3
      every_n_epochs: 1
      save_weights_only: False

  trainer:
    strategy: ddp
    num_sanity_val_steps: 0      # latent stats 在 on_train_start 完整预计算后再做验证
    max_epochs: 1600
    precision: bf16-mixed
    log_every_n_steps: 4
    # devices: [0]
