# Complete DataModule example for daily flare classification.
# Keep custom_collate_fn unset/None: the project's existing custom collate only
# retains modal_list keys and would silently drop "label".
data:
  target: data.build.DataModuleFromConfig
  params:
    batch_size: 5
    num_workers: 8
    wrap: false
    train:
      target: downstream.flare.data.dataset.FlareDataset
      params:
        modal_list: ['hmi', '0094']
        enhance_type: ['log1p', 'zscore']
        load_imgs: false
        torch_augment_type: [1024, 0.0, 0]
        time_interval: [0, 5000]
        time_step: 1
        label_path: downstream/flare/data/flare_daily_labels.csv
        expected_event_time_column: start_time
        class_groups: ['0AB', 'C', 'M', 'X']
    validation:
      target: downstream.flare.data.dataset.FlareDataset
      params:
        modal_list: ['hmi', '0094']
        enhance_type: ['log1p', 'zscore']
        load_imgs: false
        torch_augment_type: [1024, 0.0, 0]
        time_interval: [5000, 5400]
        time_step: 1
        label_path: downstream/flare/data/flare_daily_labels.csv
        expected_event_time_column: start_time
        class_groups: ['0AB', 'C', 'M', 'X']
